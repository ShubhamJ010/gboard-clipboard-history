name: Build & Release Patch Bundle

on:
  push:
    branches: [ "main" ]
    tags: [ "v*", "[0-9]+.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Standalone Patch Bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$VERSION" == "main" ]]; then
            VERSION="1.0.0"
          fi
          ./gradlew :patches:buildAndroid -Pversion="$VERSION" -Pgpr.user=${{ github.actor }} -Pgpr.key=${{ secrets.GITHUB_TOKEN }}

      - name: Upload MPP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GboardClipboardHistory.mpp
          path: patches/build/libs/*.mpp

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: patches/build/libs/*.mpp
          generate_release_notes: true
          prerelease: true
