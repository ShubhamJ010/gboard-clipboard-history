name: Build & Release Patch Bundle

on:
  push:
    branches: [ "main" ]
    tags: [ "v*", "[0-9]+.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Least privilege by default. A job that needs more asks for it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Check release metadata
        run: ./scripts/check-release-metadata.sh

      - name: Build Standalone Patch Bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(grep -E '^version\s*=' gradle.properties | cut -d'=' -f2 | tr -d ' ')"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$VERSION" || "$VERSION" == "main" ]]; then
            VERSION="0.0.4-alpha"
          fi
          ./gradlew :patches:buildAndroid -Pversion="$VERSION" -Pgpr.user="$GITHUB_ACTOR"

      - name: Upload MPP Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GboardClipboardHistory.mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: error

  apk:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install build tools
        run: sdkmanager "build-tools;35.0.0" "platforms;android-35"

      - name: Download patch bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: GboardClipboardHistory.mpp
          path: patches

      - name: Restore release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "The release secrets are not set, so no APK is built and no APK is published."
            echo "Set RELEASE_KEYSTORE_BASE64 and KEYSTORE_PASSWORD to enable it."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p tools/patcher-data
          echo "$KEYSTORE_BASE64" | base64 -d > tools/patcher-data/clipboard.keystore
          printf '%s\n' "$KEYSTORE_PASSWORD" > tools/patcher-data/keystore-clipboard.password
          chmod 600 tools/patcher-data/keystore-clipboard.password
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build patched APKs
        if: steps.keystore.outputs.enabled == 'true'
        env:
          SIGNING_KEY: clipboard
        run: |
          ./scripts/build-gboard-clipboard.sh
          ./scripts/build-gboard-clipboard-pixelboard.sh

      - name: Upload APK Artifacts
        if: steps.keystore.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-apks
          path: output/*Clipboard-History.apk
          if-no-files-found: error

  release:
    needs: [ build, apk ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download MPP Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: GboardClipboardHistory.mpp
          path: release

      - name: Download APK Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: release-apks
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*.mpp release/*.apk
          generate_release_notes: true
          prerelease: true

      - name: Attest patch bundle
        if: hashFiles('release/*.mpp') != ''
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: release/*.mpp

      - name: Attest patched APKs
        if: hashFiles('release/*.apk') != ''
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: release/*.apk
